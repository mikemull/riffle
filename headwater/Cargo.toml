[package]
name = "headwater"
version = "0.1.0"
edition = "2024"

[lib]
name = "headwater"
path = "src/lib.rs"

[[bin]]
name = "headwater"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
arrow = "55"
parquet = { version = "55", features = ["arrow"] }
anyhow = "1"
