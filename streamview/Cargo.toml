[package]
name = "streamview"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
serde = { version = "1", features = ["derive"] }
leptos-chartistry = "0.2"
chrono = "0.4"
serde_json = "1"
wasm-bindgen = "0.2"

# ssr-only: the native server binary (query engine, HTTP server). Excluded
# from the wasm/csr build that trunk compiles for the browser.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
datafusion = { version = "48", optional = true }
headwater = { path = "../headwater", optional = true }
anyhow = { version = "1", optional = true }
usgs-manifest = { path = "../usgs-manifest", optional = true }

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = [
  "leptos/ssr",
  "dep:axum",
  "dep:tower-http",
  "dep:leptos_axum",
  "dep:tokio",
  "dep:datafusion",
  "dep:headwater",
  "dep:anyhow",
  "dep:usgs-manifest",
]

[[bin]]
# Named distinctly from the `streamview` lib target -- trunk's cargo-artifact
# lookup can't otherwise disambiguate a bin and lib sharing one name.
name = "streamview-server"
path = "src/main.rs"
